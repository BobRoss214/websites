<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffc928">
  <title>Page not found | Wise Acres Organic Farm</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:"Fredoka";src:url("/assets/fonts/fredoka-latin-wght-normal.woff2") format("woff2");font-weight:300 700;font-display:swap}
    @font-face{font-family:"Nunito";src:url("/assets/fonts/nunito-latin-wght-normal.woff2") format("woff2");font-weight:200 1000;font-display:swap}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#fff8e6 radial-gradient(rgba(58,36,22,.07) 2px,transparent 2px) 0 0/28px 28px;color:#3a2416;font:600 1.1rem/1.5 "Nunito",system-ui,sans-serif;text-align:center}
    main{max-width:560px}
    .berry{width:110px;height:124px;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(58,36,22,.2))}
    h1{margin:.3em 0 .2em;font:700 clamp(2rem,7vw,3rem)/1.1 "Fredoka","Trebuchet MS",sans-serif}
    p{margin:.4em 0 1.4em}
    .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    a.btn{display:inline-block;padding:.8em 1.4em;border:3px solid #3a2416;border-radius:999px;background:#fff;color:#3a2416;font:700 1.05rem/1 "Fredoka",sans-serif;text-decoration:none;box-shadow:0 5px 0 #3a2416}
    a.btn.red{background:#d72a43;color:#fff}
    a.btn:focus-visible{outline:3px solid #2b4fd8;outline-offset:3px}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
    @media (prefers-reduced-motion:reduce){.berry{animation:none}}
  </style>
</head>
<body>
  <main>
    <svg class="berry" viewBox="0 0 64 72" aria-hidden="true">
      <g stroke="#3a2416" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M32 68C14 58 5 42 8 27c2-11 14-13 24-7 10-6 22-4 24 7 3 15-6 31-24 41Z" fill="#e5334b"/>
        <path d="M32 23 20 16l4 8-11 1 12 5 7-2 7 2 12-5-11-1 4-8Z" fill="#43a047"/>
      </g>
      <g fill="#ffd54f"><ellipse cx="22" cy="42" rx="2.2" ry="3"/><ellipse cx="36" cy="40" rx="2.2" ry="3"/><ellipse cx="44" cy="50" rx="2.2" ry="3"/><ellipse cx="26" cy="54" rx="2.2" ry="3"/></g>
    </svg>
    <h1>Oops, this row is empty</h1>
    <p>We couldn&rsquo;t find that page. It may have moved, or the link may have a typo. Let&rsquo;s get you back to the good stuff.</p>
    <div class="btns">
      <a class="btn red" href="/">Back to the farm</a>
      <a class="btn" href="/#shop">What to buy</a>
      <a class="btn" href="/#contact">Contact us</a>
    </div>
  </main>
</body>
</html>
