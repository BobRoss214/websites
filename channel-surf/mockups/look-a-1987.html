<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Look A · 1987 Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Libre+Baskerville:wght@400;700&family=Playfair+Display:ital,wght@1,800&display=swap">
<link rel="stylesheet" href="mock.css">
<style>
/* Look A: a 1980s wood-grain console in a wood-paneled den.
   4:3 picture tube; the 16:9 picture is letterboxed, and the green on-screen
   numbers live in the black bars above and below it, never on the picture. */
:root {
  --wall: #24170f; --wall-2: #3a2617; --walnut: #6b3f1f; --trim: #c9b28a; --brass: #d8b46a;
  --tube: #060807; --osd: #3dff6a; --remote: #3b2a1e; --remote-face: #a99c86; --key: #2a2420; --key-ink: #f1e8d6; --red: #c2281d;
  --f-label: "Archivo Narrow", "Arial Narrow", sans-serif; --f-brand: "Playfair Display", Georgia, serif;
  color-scheme: dark;
}
body { background: radial-gradient(ellipse at 40% 10%, var(--wall-2), var(--wall) 70%); color: var(--key-ink); }
#stage { width: 1600px; height: 900px; }
/* wall paneling grooves behind everything */
#stage::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 118px, rgba(0,0,0,.28) 118px 122px); pointer-events: none; }

.cabinet { position: absolute; left: 24px; top: 24px; width: 1180px; height: 800px; border-radius: 18px; overflow: hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12), inset 0 -6px 12px rgba(0,0,0,.4); }
.cabinet canvas.wood { position: absolute; inset: 0; width: 100%; height: 100%; }
.legs { position: absolute; left: 70px; top: 818px; width: 1090px; height: 70px; pointer-events: none; }
.legs i { position: absolute; top: 0; width: 34px; height: 64px; background: linear-gradient(90deg, #2d1a0c, #5a341a 50%, #2d1a0c); clip-path: polygon(0 0, 100% 0, 75% 100%, 25% 100%); }
.legs i:first-child { left: 0; } .legs i:last-child { right: 0; }

.bezel { position: absolute; left: 40px; top: 40px; width: 860px; height: 660px; border-radius: 34px;
  background: linear-gradient(160deg, #3a3634, #1b1918 60%, #2b2826); box-shadow: inset 0 0 0 3px #8e826d, inset 0 0 0 7px #191716, 0 6px 14px rgba(0,0,0,.5); }
.tube { position: absolute; left: 20px; top: 22px; width: 820px; height: 615px; border-radius: 52px / 60px; overflow: hidden; background: var(--tube);
  box-shadow: inset 0 0 40px rgba(0,0,0,.9); }
.tube canvas { position: absolute; left: 0; display: block; }
#barTop { top: 0; width: 820px; height: 77px; }
#pic { top: 77px; width: 820px; height: 461px; }
#barBot { top: 538px; width: 820px; height: 77px; }
#full { top: 0; width: 820px; height: 615px; }
#snow { top: 0; width: 820px; height: 615px; image-rendering: auto; filter: contrast(1.2); }
/* scanlines: only on our own drawings (the bars and full-screen cards), never on the picture */
.scan { position: absolute; left: 0; width: 820px; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
.scan.top { top: 0; height: 77px; } .scan.bot { top: 538px; height: 77px; } .scan.all { top: 0; height: 615px; }
.glass { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.14), transparent 45%), radial-gradient(ellipse at 50% 50%, #18201c, #050706 75%); }
#crt { position: absolute; inset: 0; background: #f4fff8; opacity: 0; pointer-events: none; transform: scale(.01, .006); box-shadow: 0 0 40px #dfffea; }
.tube[data-mode="on"] #crt { animation: crt-on .95s ease-out forwards; }
.tube[data-mode="off-anim"] #crt { animation: crt-off .8s ease-in forwards; }
@keyframes crt-on { 0% { opacity: 1; transform: scale(.01, .006); } 25% { opacity: 1; transform: scale(1, .006); } 60% { opacity: .9; transform: scale(1, 1); } 100% { opacity: 0; transform: scale(1, 1); } }
@keyframes crt-off { 0% { opacity: 1; transform: scale(1, 1); } 45% { opacity: 1; transform: scale(1, .005); } 70% { opacity: 1; transform: scale(.012, .008); } 100% { opacity: 0; transform: scale(.004, .004); } }
@media (prefers-reduced-motion: reduce) {
  .tube[data-mode="on"] #crt { animation: fade-out .4s forwards; transform: none; }
  .tube[data-mode="off-anim"] #crt { animation: fade-out .4s forwards; transform: none; }
  @keyframes fade-out { from { opacity: .7; } to { opacity: 0; } }
}

#turnOn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 18px;
  background: none; border: 0; color: #e9f6ee; font: 700 30px/1 var(--f-label); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
#turnOn .btn { width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff6b5c, var(--red) 55%, #6d0f09);
  box-shadow: 0 0 0 10px rgba(0,0,0,.45), 0 0 0 14px #8e826d, 0 0 60px rgba(255,70,50,.55); display: grid; place-items: center; }
#turnOn .btn svg { width: 74px; height: 74px; }
#turnOn:hover .btn, #turnOn:focus-visible .btn { box-shadow: 0 0 0 10px rgba(0,0,0,.45), 0 0 0 14px #ffd34d, 0 0 80px rgba(255,90,60,.8); }
#turnOn small { font: 500 22px var(--f-label); letter-spacing: .04em; text-transform: none; color: #b8c9be; }

/* right-hand control panel on the cabinet */
.panel { position: absolute; left: 925px; top: 40px; width: 230px; height: 660px; border-radius: 14px;
  background: linear-gradient(180deg, #2a2522, #171412); box-shadow: inset 0 0 0 3px #8e826d, inset 0 0 0 6px #120f0d; display: grid; justify-items: center; align-content: start; gap: 18px; padding-top: 22px; }
.brand { font: italic 800 34px/1 var(--f-brand); color: var(--brass); text-shadow: 0 1px 0 #fff3, 0 -1px 0 #0008; }
.brand-sub { margin-top: -10px; font: 700 12px var(--f-label); letter-spacing: .28em; color: #bfae8a; }
.dialbox { position: relative; width: 200px; height: 200px; cursor: pointer; }
.dialbox svg { width: 100%; height: 100%; }
#dialKnob { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 100px 100px; }
.dial-label { font: 700 13px var(--f-label); letter-spacing: .25em; color: #bfae8a; margin-top: -10px; }
.knobs { display: flex; gap: 22px; }
.knob { width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; position: relative;
  background: radial-gradient(circle at 40% 35%, #d9d2c4, #8b8274 60%, #403a33); box-shadow: 0 4px 8px #000a, inset 0 -3px 6px #0006; }
.knob::after { content: ""; position: absolute; left: 50%; top: 8px; width: 6px; height: 22px; margin-left: -3px; border-radius: 3px; background: #2a2420; }
#volKnob { transition: transform .2s; }
.knob-cap { font: 700 12px var(--f-label); letter-spacing: .2em; color: #bfae8a; text-align: center; margin-top: 6px; }
.pull { display: grid; justify-items: center; }
#powerKnob { width: 70px; height: 70px; background: radial-gradient(circle at 40% 35%, #f0e6cf, #a8987a 60%, #4a4032); }
#powerKnob::after { display: none; }
.pilot { width: 12px; height: 12px; border-radius: 50%; background: #3a1d08; margin-top: 10px; box-shadow: inset 0 1px 2px #000; }
.pilot.on { background: #ffb347; box-shadow: 0 0 12px #ffa030; }
.badge { font: 700 11px var(--f-label); letter-spacing: .12em; color: #9c8d70; text-align: center; line-height: 1.6; }

.grille { position: absolute; left: 40px; top: 718px; width: 1115px; height: 56px; border-radius: 10px;
  background: repeating-linear-gradient(90deg, #2a1d14 0 3px, #3b2a1d 3px 6px), #2a1d14; box-shadow: inset 0 0 0 2px #8e826d, inset 0 4px 10px #000a; }

/* the remote */
.remote { position: absolute; left: 1250px; top: 36px; width: 300px; height: 800px; border-radius: 40px 40px 70px 70px;
  background: linear-gradient(90deg, #2a1e15, var(--remote) 15%, #4a3526 50%, var(--remote) 85%, #2a1e15);
  box-shadow: 0 30px 50px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.15); padding: 28px 24px; box-sizing: border-box; display: grid; gap: 14px; align-content: start; }
.remote .face { background: linear-gradient(180deg, #b8ab94, var(--remote-face)); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: inset 0 2px 4px #0005; }
.rk { font: 700 22px/1 var(--f-label); color: var(--key-ink); background: linear-gradient(180deg, #3a322c, var(--key)); border: 0; border-radius: 12px; height: 56px; cursor: pointer; padding: 0;
  box-shadow: 0 4px 0 #120e0b, 0 6px 8px #0006; text-transform: uppercase; letter-spacing: .04em; touch-action: manipulation; }
.rk:active, .rk.pressed { transform: translateY(3px); box-shadow: 0 1px 0 #120e0b, 0 2px 4px #0006; }
.rk small { display: block; font-size: 13px; letter-spacing: .12em; opacity: .75; margin-top: 3px; }
.rk.red { background: linear-gradient(180deg, #e24a3a, var(--red)); box-shadow: 0 4px 0 #5c0f09, 0 6px 8px #0006; }
.r-row .rk.cream { font-size: 17px; }
.rk.cream { background: linear-gradient(180deg, #efe6d2, #d3c6aa); color: #2a2420; box-shadow: 0 4px 0 #7d715a, 0 6px 8px #0006; }
.r-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.r-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rocker { display: grid; gap: 4px; }
.rocker .rk { height: 60px; font-size: 28px; }
.rocker .lbl { text-align: center; font: 700 16px var(--f-label); letter-spacing: .2em; color: #2a2420; }
.r-brand { text-align: center; font: italic 800 22px var(--f-brand); color: var(--brass); margin-top: 4px; }
.hint { position: absolute; left: 24px; top: 852px; width: 1180px; font: 500 18px var(--f-label); color: #b39f80; letter-spacing: .03em; }
</style>
</head>
<body>
<div class="stage-wrap"><div id="stage">
  <div class="cabinet">
    <canvas class="wood" width="1180" height="800"></canvas>
    <div class="bezel">
      <div class="tube" id="tube" data-mode="off">
        <canvas id="barTop" width="1640" height="154"></canvas>
        <canvas id="pic" width="960" height="540"></canvas>
        <canvas id="barBot" width="1640" height="154"></canvas>
        <div class="scan top"></div><div class="scan bot"></div>
        <canvas id="full" width="1640" height="1230" hidden></canvas>
        <canvas id="snow" width="205" height="154" hidden></canvas>
        <div class="scan all" id="scanAll" hidden></div>
        <div class="glass" id="glass"></div>
        <div id="crt"></div>
        <button id="turnOn" type="button" aria-label="Turn on the TV">
          <span class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></span>
          Turn on the TV
          <small>or press any button on the remote</small>
        </button>
      </div>
    </div>
    <div class="panel">
      <div class="brand">Channel Surf</div>
      <div class="brand-sub">SOLID STATE COLOR</div>
      <div class="dialbox" id="dial" title="Click left side for down, right side for up">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="96" fill="#14110f" stroke="#8e826d" stroke-width="3"/>
          <g id="dialNums" font-family="Archivo Narrow, sans-serif" font-weight="700" font-size="17" fill="#e9dcc0" text-anchor="middle"></g>
          <g id="dialKnob">
            <circle cx="100" cy="100" r="62" fill="url(#kg)" stroke="#2a2420" stroke-width="2"/>
            <rect x="94" y="40" width="12" height="120" rx="6" fill="#3a332c"/>
            <path d="M100 36 l9 16 h-18z" fill="#ffd34d"/>
          </g>
          <defs><radialGradient id="kg" cx=".4" cy=".35"><stop offset="0" stop-color="#e6dfd1"/><stop offset=".6" stop-color="#93897a"/><stop offset="1" stop-color="#3e3830"/></radialGradient></defs>
        </svg>
      </div>
      <div class="dial-label">CHANNEL</div>
      <div class="knobs">
        <div><button class="knob" id="volKnob" type="button" aria-label="Volume: click left side to lower, right side to raise"></button><div class="knob-cap">VOLUME</div></div>
        <div class="pull"><button class="knob" id="powerKnob" type="button" aria-label="Power"></button><div class="knob-cap">PULL ON</div><div class="pilot" id="pilot"></div></div>
      </div>
      <div class="badge">AUTOMATIC FINE TUNING<br>CABLE READY · 99 CHANNELS</div>
    </div>
    <div class="grille"></div>
  </div>
  <div class="legs"><i></i><i></i></div>

  <div class="remote" id="remote">
    <button class="rk red" data-k="power" type="button">Power</button>
    <div class="face">
      <div class="r-row">
        <button class="rk" data-k="1" type="button">1</button><button class="rk" data-k="2" type="button">2</button><button class="rk" data-k="3" type="button">3</button>
        <button class="rk" data-k="4" type="button">4</button><button class="rk" data-k="5" type="button">5</button><button class="rk" data-k="6" type="button">6</button>
        <button class="rk" data-k="7" type="button">7</button><button class="rk" data-k="8" type="button">8</button><button class="rk" data-k="9" type="button">9</button>
        <button class="rk cream" data-k="last" type="button">Last</button><button class="rk" data-k="0" type="button">0</button><button class="rk cream" data-k="enter" type="button">Enter</button>
      </div>
    </div>
    <div class="face">
      <div class="r-pair">
        <div class="rocker"><div class="lbl">CHAN</div><button class="rk" data-k="up" type="button" aria-label="Channel up">▲</button><button class="rk" data-k="down" type="button" aria-label="Channel down">▼</button></div>
        <div class="rocker"><div class="lbl">VOL</div><button class="rk" data-k="vup" type="button" aria-label="Volume up">+</button><button class="rk" data-k="vdown" type="button" aria-label="Volume down">−</button></div>
      </div>
      <div class="r-pair">
        <button class="rk cream" data-k="mute" type="button">Mute</button><button class="rk cream" data-k="guide" type="button">Guide</button>
        <button class="rk cream" data-k="info" type="button">Info</button><button class="rk cream" data-k="cc" type="button">CC</button>
      </div>
      <button class="rk cream" data-k="fav" type="button">Favorites</button>
    </div>
    <div class="r-brand">Channel Surf</div>
  </div>
  <div class="hint">Turn the CHANNEL dial (click its left or right side), or use the remote. Try channel 1 for listings, 4 at the right time for a broken video, 9 for an empty channel.</div>
</div></div>

<script src="shared.js"></script>
<script>
(() => {
  const { airing, listings, next, clock, minsLeft, Picture, Snow, Sound, pixelText, TV, bindKeys, fitStage, mockBar, CHANNELS, rng } = CS;
  const $ = s => document.querySelector(s);
  const tube = $('#tube'), barTop = $('#barTop'), barBot = $('#barBot'), full = $('#full'), snowC = $('#snow'), pic = $('#pic');
  const tctx = barTop.getContext('2d'), bctx = barBot.getContext('2d'), fctx = full.getContext('2d');
  tctx.scale(2, 2); bctx.scale(2, 2); fctx.scale(2, 2);
  const picture = new Picture(pic), snow = new Snow(snowC);
  const GREEN = '#3dff6a', WHITE = '#f2fff4', YELLOW = '#ffe14d', CYAN = '#7fe8ff';

  // ---- wood grain, drawn once ----
  (function wood() {
    const c = document.querySelector('canvas.wood'), x = c.getContext('2d'), W = c.width, H = c.height;
    const img = x.createImageData(W, H), d = img.data, r = rng(7);
    const knots = Array.from({ length: 5 }, () => ({ x: r() * W, y: r() * H, s: 30 + r() * 60 }));
    for (let y = 0; y < H; y++) for (let X = 0; X < W; X++) {
      let w = y + Math.sin(X / 180) * 14 + Math.sin(X / 47 + y / 90) * 4;
      for (const k of knots) { const dx = X - k.x, dy = y - k.y, dd = dx * dx + dy * dy; w += k.s * 900 / (dd + 900) * Math.sign(dy || 1); }
      const g = 0.5 + 0.5 * Math.sin(w / 3.1) * Math.sin(w / 11.7 + X / 400);
      const n = (Math.random() - 0.5) * 0.06;
      const t = 0.72 + 0.28 * g + n;
      const i = (y * W + X) * 4; d[i] = 112 * t; d[i + 1] = 64 * t; d[i + 2] = 30 * t; d[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
  })();

  // ---- dial numbers ----
  const watchable = CHANNELS;
  const angleFor = i => -120 + i * (240 / (watchable.length - 1));
  $('#dialNums').innerHTML = watchable.map((ch, i) => { const a = angleFor(i) * Math.PI / 180; return `<text x="${100 + Math.sin(a) * 80}" y="${100 - Math.cos(a) * 80 + 6}">${ch.num}</text>`; }).join('');
  function setDial(i) { $('#dialKnob').style.transform = `rotate(${angleFor(i)}deg)`; }

  // ---- on-screen display state ----
  let mode = 'off', banner = null, bannerUntil = 0, typed = '', typedUntil = 0, typedBad = false, volMsg = null, volUntil = 0, msg = '', msgUntil = 0;
  let guideSel = 0, guideScroll = 0, guidePausedUntil = 0, fullDraw = null, fullStart = 0;

  function setMode(m) {
    mode = m; const isPic = m === 'picture';
    pic.hidden = !isPic; barTop.hidden = barBot.hidden = !(isPic || m === 'blank');
    full.hidden = !['guide', 'standby', 'offair', 'ident'].includes(m); snowC.hidden = m !== 'snow';
    $('#scanAll').hidden = full.hidden && snowC.hidden;
    document.querySelectorAll('.scan.top,.scan.bot').forEach(e => e.hidden = barTop.hidden);
    $('#glass').hidden = m !== 'off' && m !== 'off-anim';
    $('#turnOn').hidden = m !== 'off';
    if (m !== 'snow') snow.stop();
    if (!isPic) picture.stop();
    if (full.hidden) fullDraw = null;
  }

  function drawBars() {
    const now = Date.now();
    tctx.clearRect(0, 0, 820, 77); bctx.clearRect(0, 0, 820, 77);
    if (mode !== 'picture' && mode !== 'blank') return;
    const showBanner = banner && now < bannerUntil;
    // top bar: clock left, big channel number right
    if (showBanner || now < typedUntil) pixelText(tctx, clock(now), 30, 26, 4, { color: WHITE });
    if (now < typedUntil) pixelText(tctx, typed, 790, 11, 8, { color: typedBad ? '#ff6a5c' : GREEN, align: 'right' });
    else if (showBanner) pixelText(tctx, String(banner.ch.num), 790, 11, 8, { color: GREEN, align: 'right' });
    // bottom bar: volume, a message, or the show info
    if (now < volUntil) {
      if (volMsg.muted) pixelText(bctx, 'MUTE', 30, 25, 4, { color: GREEN });
      else { pixelText(bctx, 'VOLUME', 30, 25, 4, { color: GREEN }); bctx.save(); bctx.shadowColor = GREEN; bctx.shadowBlur = 6; bctx.fillStyle = GREEN; for (let i = 0; i < 20; i++) { bctx.globalAlpha = i < volMsg.v / 5 ? 1 : 0.15; bctx.fillRect(220 + i * 27, 24, 18, 30); } bctx.restore(); }
    } else if (now < msgUntil) {
      pixelText(bctx, msg, 410, 25, 4, { color: GREEN, align: 'center' });
    } else if (showBanner) {
      const b = banner, a = b.a;
      const line1 = b.ch.name + (b.opts.upNext ? '  UP NEXT' : b.opts.replaced ? '  NOW' : '');
      pixelText(bctx, line1, 30, 10, 3, { color: CYAN });
      if (a) {
        pixelText(bctx, b.opts.upNext ? clock(a.start, true) : minsLeft(a, now) + ' MIN LEFT', 790, 10, 3, { color: CYAN, align: 'right' });
        let t = a.show.t.toUpperCase(); if (t.length > 31) t = t.slice(0, 30) + '.';
        pixelText(bctx, t, 30, 38, 4, { color: GREEN });
      }
    }
  }
  setInterval(drawBars, 200);

  // ---- full-screen cards (our own drawings: OK to style however we like) ----
  function bars(x, W, H) { // color bars, the classic test signal
    const cols = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
    cols.forEach((c, i) => { x.fillStyle = c; x.fillRect(i * W / 7, 0, W / 7 + 1, H * 0.68); });
    const rev = ['#0000c0', '#131313', '#c000c0', '#131313', '#00c0c0', '#131313', '#c0c0c0'];
    rev.forEach((c, i) => { x.fillStyle = c; x.fillRect(i * W / 7, H * 0.68, W / 7 + 1, H * 0.08); });
    x.fillStyle = '#101010'; x.fillRect(0, H * 0.76, W, H * 0.24);
    ['#00214c', '#ffffff', '#32006a'].forEach((c, i) => { x.fillStyle = c; x.fillRect(i * W * 0.17, H * 0.76, W * 0.17, H * 0.24); });
  }
  function card(lines, sub) {
    const W = 820, H = 615; bars(fctx, W, H);
    fctx.fillStyle = 'rgba(0,0,40,.92)'; fctx.fillRect(110, 200, 600, 190); fctx.strokeStyle = WHITE; fctx.lineWidth = 4; fctx.strokeRect(118, 208, 584, 174);
    lines.forEach((l, i) => pixelText(fctx, l, 410, 236 + i * 62, 7, { color: WHITE, align: 'center' }));
    if (sub) pixelText(fctx, sub, 410, 410 + 22, 3, { color: '#000', outline: null, glow: false, align: 'center' });
  }
  const DRAW = {
    standby() { card(['PLEASE', 'STAND BY'], ''); },
    offair(t) { card(['OFF THE', 'AIR'], ''); fctx.fillStyle = '#101010'; fctx.fillRect(140, 470, 540, 60); pixelText(fctx, 'NOTHING SCHEDULED ON ' + CHANNELS[tv.idx].num, 410, 486, 3, { color: WHITE, align: 'center' }); },
    ident(t, ctx) { // 80s station ID: stripes sweep in, big number, coming up next
      const W = 820, H = 615, x = fctx; const ch = CHANNELS[tv.idx];
      x.fillStyle = '#060a24'; x.fillRect(0, 0, W, H);
      const cols = ['#ff3b30', '#ff9500', '#ffd60a', '#34c759', '#0a84ff'];
      const p = Math.min(1, t / 900);
      cols.forEach((c, i) => { x.fillStyle = c; const y = 150 + i * 26; x.fillRect(-W + p * W * 1.0 + i * 30, y, W * 0.9, 16); });
      x.save(); x.globalAlpha = Math.min(1, t / 600);
      pixelText(x, String(ch.num), 640, 120, 22, { color: WHITE });
      pixelText(x, ch.name, 410, 330, 6, { color: YELLOW, align: 'center' });
      x.restore();
      if (ctx && ctx.next) {
        x.save(); x.globalAlpha = Math.max(0, Math.min(1, (t - 1200) / 500));
        pixelText(x, 'COMING UP NEXT', 410, 420, 4, { color: CYAN, align: 'center' });
        let n = ctx.next.show.t.toUpperCase(); if (n.length > 30) n = n.slice(0, 29) + '.';
        pixelText(x, n, 410, 470, 4, { color: WHITE, align: 'center' });
        x.restore();
      }
    },
    guide(t) { // 80s character-generator listings: blue screen, slow upward scroll
      const W = 820, H = 615, x = fctx, now = Date.now();
      x.fillStyle = '#0a1a9c'; x.fillRect(0, 0, W, H);
      const rows = guideRows();
      const rowH = 66, top = 92, viewH = H - top - 60;
      if (now > guidePausedUntil) guideScroll = (guideScroll + 0.5) % (rows.length * rowH);
      else { const target = guideSel * rowH - viewH / 2 + rowH / 2; guideScroll += (target - guideScroll) * 0.15; }
      x.save(); x.beginPath(); x.rect(0, top, W, viewH); x.clip();
      for (let rep = -1; rep <= 1; rep++) rows.forEach((r, i) => {
        const y = top + i * rowH + rep * rows.length * rowH - guideScroll;
        if (y < top - rowH || y > top + viewH) return;
        if (i === guideSel && now < guidePausedUntil + 4000) { x.fillStyle = '#ffe14d'; x.fillRect(16, y + 2, W - 32, rowH - 6); }
        const sel = i === guideSel && now < guidePausedUntil + 4000;
        const ink = sel ? '#0a1a9c' : WHITE, ink2 = sel ? '#0a1a9c' : CYAN, num = sel ? '#0a1a9c' : YELLOW;
        pixelText(x, String(r.ch.num).padStart(2, ' '), 30, y + 10, 3, { color: num, outline: null, glow: false });
        pixelText(x, r.ch.call, 80, y + 10, 3, { color: num, outline: null, glow: false });
        pixelText(x, r.l1, 180, y + 10, 3, { color: ink, outline: null, glow: false });
        pixelText(x, r.l2, 180, y + 36, 3, { color: ink2, outline: null, glow: false });
      });
      x.restore();
      // header and footer bands
      x.fillStyle = '#071270'; x.fillRect(0, 0, W, top - 8); x.fillRect(0, H - 56, W, 56);
      pixelText(x, 'CABLE LISTINGS', 46, 26, 5, { color: YELLOW, outline: null });
      pixelText(x, clock(now), 774, 30, 4, { color: WHITE, align: 'right', outline: null });
      const foot = Math.floor(now / 4000) % 2 ? 'TYPE A CHANNEL NUMBER TO WATCH' : 'UP/DOWN TO PICK  ENTER TO WATCH';
      pixelText(x, foot, 410, H - 40, 3, { color: WHITE, align: 'center', outline: null, glow: false });
    },
  };
  function guideRows() {
    const now = Date.now();
    return CHANNELS.filter(c => c.kind !== 'guide').map(ch => {
      const a = airing(ch, now);
      if (!a) return { ch, l1: 'OFF THE AIR', l2: '' };
      const cut = s => (s.length > 34 ? s.slice(0, 33) + '.' : s).toUpperCase();
      const n = next(ch, now);
      return { ch, l1: 'NOW  ' + cut(a.bumper && n ? n.show.t : a.show.t), l2: n ? clock(n.start, false).padStart(5, ' ') + ' ' + cut(n.show.t) : '' };
    });
  }
  function startFull(kind, ctx) {
    setMode(kind); fullDraw = DRAW[kind]; fullStart = performance.now();
    const loop = now => { if (fullDraw !== DRAW[kind] || mode !== kind) return; fctx.clearRect(0, 0, 820, 615); DRAW[kind](now - fullStart, ctx); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  // ---- the look's side of the TV ----
  const ui = {
    powerOn(done) {
      $('#pilot').classList.add('on'); setMode('blank'); tube.dataset.mode = 'on';
      setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 200 : 700);
    },
    powerOff() {
      $('#pilot').classList.remove('on'); banner = null; setMode('blank'); tube.dataset.mode = 'off-anim';
      setTimeout(() => { tube.dataset.mode = 'off'; setMode('off'); }, 850);
    },
    channelNumber(ch) { setDial(CHANNELS.indexOf(ch)); Sound.click(0.4); typedUntil = 0; },
    blank() { setMode('blank'); },
    snow() { setMode('snow'); snow.start(); },
    picture(ch, a) { setMode('picture'); picture.show(ch, a); },
    showGuide(ch) { guidePausedUntil = 0; startFull('guide'); },
    offAir(ch) { startFull('offair'); },
    standBy(ch) { startFull('standby'); },
    ident(ch, nx) { startFull('ident', { next: nx }); },
    banner(ch, a, opts = {}) {
      // On full-screen cards we show the number inside the card area via the top bar logic; on picture we use the bars.
      banner = { ch, a, opts }; bannerUntil = Date.now() + (opts.info ? 6000 : 4000);
      if (mode === 'guide' || mode === 'offair' || mode === 'standby' || mode === 'ident') { /* cards carry their own text */ }
    },
    typing(s, bad) { typed = s.length === 1 ? s + '-' : s; typedBad = !!bad; typedUntil = Date.now() + 2000; drawBars(); },
    volume(v, muted) { volMsg = { v, muted }; volUntil = Date.now() + 2500; drawBars(); },
    cc(on) { msg = on ? 'CAPTIONS ON' : 'CAPTIONS OFF'; msgUntil = Date.now() + 2500; drawBars(); },
    guideKey(k) {
      const n = CHANNELS.length - 1;
      if (k === 'ArrowDown') { guideSel = (guideSel + 1) % n; guidePausedUntil = Date.now() + 8000; return true; }
      if (k === 'ArrowUp') { guideSel = (guideSel - 1 + n) % n; guidePausedUntil = Date.now() + 8000; return true; }
      if (k === 'Enter') { const ch = guideRows()[guideSel].ch; tv.tune(CHANNELS.indexOf(ch)); return true; }
      return false;
    },
  };

  const tv = new TV(ui);
  setMode('off');
  bindKeys(tv);
  mockBar('look-a-1987.html', tv);
  fitStage($('#stage'), 1600, 900);

  // tapping a row in the listings tunes there
  full.addEventListener('click', e => {
    if (mode !== 'guide') return;
    const r = full.getBoundingClientRect(); const y = (e.clientY - r.top) / r.height * 615;
    const rows = guideRows(); const idx = Math.floor((y - 92 + guideScroll) / 66);
    const i = ((idx % rows.length) + rows.length) % rows.length;
    tv.tune(CHANNELS.indexOf(rows[i].ch));
  });

  // remote buttons: keep keyboard focus on the page, not the button
  const act = { power: () => tv.power(), up: () => tv.up(), down: () => tv.down(), vup: () => tv.vol(10), vdown: () => tv.vol(-10), mute: () => tv.mute(), guide: () => tv.guide(), info: () => tv.info(), cc: () => tv.toggleCC(), fav: () => tv.favNext(), last: () => tv.last(), enter: () => tv.enter() };
  document.querySelectorAll('[data-k]').forEach(b => {
    b.tabIndex = -1;
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      const k = b.dataset.k;
      if (!tv.on && k !== 'power') { tv.power(); return; } // any button turns it on
      if (/^\d$/.test(k)) tv.digit(k); else act[k]();
    });
  });
  $('#turnOn').addEventListener('click', () => tv.power());
  $('#powerKnob').addEventListener('click', () => tv.power());
  $('#dial').addEventListener('click', e => { if (!tv.on) return; const r = e.currentTarget.getBoundingClientRect(); (e.clientX - r.left < r.width / 2) ? tv.down() : tv.up(); });
  $('#dial').addEventListener('wheel', e => { if (!tv.on) return; e.preventDefault(); e.deltaY > 0 ? tv.up() : tv.down(); }, { passive: false });
  $('#volKnob').addEventListener('click', e => { if (!tv.on) return; const r = e.currentTarget.getBoundingClientRect(); tv.vol(e.clientX - r.left < r.width / 2 ? -10 : 10); $('#volKnob').style.transform = `rotate(${(tv.volume - 50) * 2.6}deg)`; });
  setDial(tv.idx);
  window.tv = tv;
})();
</script>
</body>
</html>
