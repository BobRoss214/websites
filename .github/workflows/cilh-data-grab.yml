name: cilh raw data grab
# Fetches public source files from inside GitHub's network (the dev container cannot reach these hosts),
# trims them to North and South Carolina, and commits the trimmed raw files. The build pipeline turns
# these into the site's data snapshot.
on:
  workflow_dispatch:
  push:
    branches: [claude/cool-feynman-2eza07]
    paths: ['.github/workflows/cilh-data-grab.yml']
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare
        run: |
          mkdir -p raw can-i-live-here/data/raw
          echo "UA=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 canilivehere-data-bot" >> $GITHUB_ENV
      - name: Census ACS 5-year via table-based summary files (no key needed)
        continue-on-error: true
        run: |
          set -e
          mkdir -p raw/acs
          for Y in 2024 2023; do
            ok=1
            for T in b01003 b19013 b25064 b25077 b25103 b08013 b08134 b28002 b25003 b25031 b11001 b25001 b01002 b19301; do
              U="https://www2.census.gov/programs-surveys/acs/summary_file/$Y/table-based-SF/data/5YRData/acsdt5y$Y-$T.dat"
              if ! curl -sSfL -A "$UA" "$U" -o raw/acs/$T.dat; then echo "missing $U"; ok=0; break; fi
              (head -1 raw/acs/$T.dat; grep -E '^(0500000US(37|45)|1600000US(37|45)|8600000US(27|28|29))' raw/acs/$T.dat) > can-i-live-here/data/raw/acs_$T.txt
              echo "$T $(wc -l < can-i-live-here/data/raw/acs_$T.txt) rows"
            done
            if [ $ok = 1 ]; then echo "$Y" > can-i-live-here/data/raw/acs_vintage.txt; echo "ACS summary files vintage $Y ok"; break; fi
          done
      - name: Census Gazetteer 2024
        continue-on-error: true
        run: |
          set -e
          for G in counties place zcta; do
            curl -sSL -A "$UA" "https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_Gaz_${G}_national.zip" -o raw/gaz_$G.zip
            unzip -o -q raw/gaz_$G.zip -d raw/gaz_$G
          done
          f=$(ls raw/gaz_counties/*.txt); (head -1 "$f"; grep -E "^(NC|SC)\s" "$f") > can-i-live-here/data/raw/gaz_counties.txt
          f=$(ls raw/gaz_place/*.txt); (head -1 "$f"; grep -E "^(NC|SC)\s" "$f") > can-i-live-here/data/raw/gaz_place.txt
          f=$(ls raw/gaz_zcta/*.txt); (head -1 "$f"; grep -E "^(27|28|29)[0-9]{3}\s" "$f") > can-i-live-here/data/raw/gaz_zcta.txt
          curl -sSL -A "$UA" "https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/tab20_zcta520_county20_natl.txt" -o raw/zcta_county.txt
          (head -1 raw/zcta_county.txt; grep -E "^[0-9]*\|(27|28|29)[0-9]{3}\|" raw/zcta_county.txt || true) > can-i-live-here/data/raw/zcta_county_rel.txt
          wc -l can-i-live-here/data/raw/gaz_*.txt can-i-live-here/data/raw/zcta_county_rel.txt
      - name: Census cartographic boundaries 2024 (simplified GeoJSON via mapshaper)
        continue-on-error: true
        run: |
          set -e
          npm i -g mapshaper@0.6 >/dev/null 2>&1
          for F in cb_2024_us_county_500k cb_2024_37_place_500k cb_2024_45_place_500k; do
            curl -sSL -A "$UA" "https://www2.census.gov/geo/tiger/GENZ2024/shp/$F.zip" -o raw/$F.zip; unzip -o -q raw/$F.zip -d raw/$F
          done
          curl -sSL -A "$UA" "https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_zcta520_500k.zip" -o raw/cb_2020_us_zcta520_500k.zip; unzip -o -q raw/cb_2020_us_zcta520_500k.zip -d raw/cb_2020_us_zcta520_500k
          mapshaper raw/cb_2024_us_county_500k/cb_2024_us_county_500k.shp -filter 'STATEFP=="37" || STATEFP=="45"' -simplify 12% keep-shapes -o precision=0.0001 format=geojson can-i-live-here/data/raw/counties.geojson
          mapshaper raw/cb_2024_37_place_500k/cb_2024_37_place_500k.shp raw/cb_2024_45_place_500k/cb_2024_45_place_500k.shp combine-files -merge-layers -simplify 15% keep-shapes -o precision=0.0001 format=geojson can-i-live-here/data/raw/places.geojson
          mapshaper raw/cb_2020_us_zcta520_500k/cb_2020_us_zcta520_500k.shp -filter '/^(27|28|29)/.test(ZCTA5CE20)' -simplify 12% keep-shapes -o precision=0.0001 format=geojson can-i-live-here/data/raw/zctas.geojson
          ls -la can-i-live-here/data/raw/*.geojson
      - name: Zillow research data (ZHVI, ZORI) trimmed to NC and SC
        continue-on-error: true
        run: |
          set -e
          for F in zhvi/County_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month zhvi/Zip_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month zhvi/City_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month zori/County_zori_uc_sfrcondomfr_sm_sa_month zori/Zip_zori_uc_sfrcondomfr_sm_sa_month zori/City_zori_uc_sfrcondomfr_sm_sa_month; do
            N=$(basename $F); curl -sSL -A "$UA" "https://files.zillowstatic.com/research/public_csvs/$F.csv" -o raw/$N.csv
            python3 - "$N" <<'PY'
          import csv,sys
          n=sys.argv[1]; rows=list(csv.reader(open(f'raw/{n}.csv',newline='')))
          h=rows[0]; si=h.index('StateName') if 'StateName' in h else h.index('State')
          keep=[h]+[r for r in rows[1:] if r[si] in ('NC','SC')]
          csv.writer(open(f'can-i-live-here/data/raw/zillow_{n}.csv','w',newline='')).writerows(keep); print(n,len(keep)-1)
          PY
          done
      - name: Redfin Data Center county market tracker trimmed to NC and SC
        continue-on-error: true
        run: |
          curl -sSL -A "$UA" "https://redfin-public-data.s3-us-west-2.amazonaws.com/redfin_market_tracker/county_market_tracker.tsv000.gz" | zcat | awk -F'\t' 'NR==1 || $0 ~ /"North Carolina"|"South Carolina"/' > can-i-live-here/data/raw/redfin_county.tsv; wc -l can-i-live-here/data/raw/redfin_county.tsv
      - name: Mortgage rates (Freddie Mac PMMS, FRED fallback)
        continue-on-error: true
        run: |
          curl -sSL -A "$UA" "https://www.freddiemac.com/pmms/docs/PMMS_history.csv" -o can-i-live-here/data/raw/pmms_history.csv; tail -3 can-i-live-here/data/raw/pmms_history.csv
          curl -sSL -A "$UA" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=MORTGAGE30US,MORTGAGE15US" -o can-i-live-here/data/raw/fred_mortgage.csv; tail -2 can-i-live-here/data/raw/fred_mortgage.csv
      - name: HUD Fair Market Rents (FY2027 then FY2026), FHFA loan limits
        continue-on-error: true
        run: |
          for Y in 2027 2026; do YY=${Y:2:2}
            for N in FY${YY}_FMRs.xlsx FY${YY}_FMRs_revised.xlsx fy${Y}_fmrs.xlsx; do
              if curl -sSfL -A "$UA" "https://www.huduser.gov/portal/datasets/fmr/fmr$Y/$N" -o raw/fmr.xlsx && [ $(stat -c%s raw/fmr.xlsx) -gt 50000 ]; then cp raw/fmr.xlsx can-i-live-here/data/raw/hud_fmr_fy$Y.xlsx; echo "got $Y/$N"; break; fi
            done
            for N in fy${Y}_safmrs.xlsx FY${YY}_SAFMRs.xlsx fy${Y}_safmrs_revised.xlsx; do
              if curl -sSfL -A "$UA" "https://www.huduser.gov/portal/datasets/fmr/fmr$Y/$N" -o raw/safmr.xlsx && [ $(stat -c%s raw/safmr.xlsx) -gt 50000 ]; then cp raw/safmr.xlsx can-i-live-here/data/raw/hud_safmr_fy$Y.xlsx; echo "got $Y/$N"; break; fi
            done
          done
          for Y in 2027 2026; do YY=${Y:2:2}; for N in FY${YY}_FMRs.xlsx fy${Y}_safmrs.xlsx; do printf "%s " "$Y/$N"; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" -A "$UA" "https://www.huduser.gov/portal/datasets/fmr/fmr$Y/$N"; done; done
          curl -sSL -A "$UA" "https://www.huduser.gov/portal/datasets/fmr.html" -o raw/fmr.html; grep -oiE '[^"'"'"' ]*\.xlsx?' raw/fmr.html | sort -u > can-i-live-here/data/raw/hud_fmr_links.txt || true; head -40 can-i-live-here/data/raw/hud_fmr_links.txt
          for L in $(grep -iE 'fmr2027|fmr2026' can-i-live-here/data/raw/hud_fmr_links.txt | head -8); do case "$L" in http*) U="$L";; /*) U="https://www.huduser.gov$L";; *) U="https://www.huduser.gov/portal/datasets/$L";; esac; N=$(basename "$U"); curl -sSfL -A "$UA" "$U" -o "can-i-live-here/data/raw/hud_$N" && echo "got $U" || echo "fail $U"; done
          curl -sSfL -A "$UA" "https://www.fhfa.gov/document/d/cll/fullcountyloanlimitlist2026_hera-based_final_flat.xlsx" -o can-i-live-here/data/raw/fhfa_limits_2026.xlsx || echo "fhfa xlsx not at guessed url"
          curl -sSL -A "$UA" "https://www.fhfa.gov/data/conforming-loan-limit-cll-values" -o raw/fhfa.html; grep -oE 'href="[^"]*\.(xlsx|pdf)"' raw/fhfa.html | sort -u > can-i-live-here/data/raw/fhfa_links.txt || true
      - name: FEMA National Risk Index (counties, tracts trimmed)
        continue-on-error: true
        run: |
          set -e
          curl -sSL -A "$UA" "https://hazards.fema.gov/nri/Content/StaticDocuments/DataDownload/NRI_Table_Counties/NRI_Table_Counties.zip" -o raw/nri_c.zip; file raw/nri_c.zip; unzip -o -q raw/nri_c.zip -d raw/nri_c
          f=$(ls raw/nri_c/*.csv | grep -v -i dictionary | head -1); (head -1 "$f"; grep -E '^[^,]*,[^,]*,(NC|SC),' "$f" || awk -F',' 'NR>1 && ($3=="NC"||$3=="SC"||$4=="NC"||$4=="SC")' "$f") > can-i-live-here/data/raw/nri_counties.csv; wc -l can-i-live-here/data/raw/nri_counties.csv
          cp raw/nri_c/*ictionary*.csv can-i-live-here/data/raw/nri_dictionary.csv 2>/dev/null || true
          curl -sSL -A "$UA" "https://hazards.fema.gov/nri/Content/StaticDocuments/DataDownload/NRI_Table_CensusTracts/NRI_Table_CensusTracts.zip" -o raw/nri_t.zip; file raw/nri_t.zip; unzip -o -q raw/nri_t.zip -d raw/nri_t
          f=$(ls raw/nri_t/*.csv | grep -v -i dictionary | head -1); python3 - "$f" <<'PY'
          import csv,sys
          r=csv.reader(open(sys.argv[1],newline='')); h=next(r); si=h.index('STATEABBRV')
          w=csv.writer(open('can-i-live-here/data/raw/nri_tracts.csv','w',newline='')); w.writerow(h); n=0
          for row in r:
              if row[si] in ('NC','SC'): w.writerow(row); n+=1
          print('tracts',n)
          PY
      - name: USDA SSURGO farmland class acres by soil survey area (Soil Data Access)
        continue-on-error: true
        run: |
          Q="SELECT l.areasymbol, l.areaname, m.farmlndcl, SUM(m.muacres) AS acres FROM legend l INNER JOIN mapunit m ON m.lkey = l.lkey WHERE l.areasymbol LIKE 'NC%' OR l.areasymbol LIKE 'SC%' GROUP BY l.areasymbol, l.areaname, m.farmlndcl ORDER BY l.areasymbol"
          curl -sS -A "$UA" -X POST "https://sdmdataaccess.nrcs.usda.gov/Tabular/post.rest" --data-urlencode "query=$Q" --data-urlencode "format=JSON+COLUMNNAME" -o can-i-live-here/data/raw/ssurgo_farmland.json; head -c 400 can-i-live-here/data/raw/ssurgo_farmland.json
      - name: USDA Census of Agriculture 2022 county land values (bulk file, trimmed)
        continue-on-error: true
        run: |
          curl -sSL -A "$UA" "https://www.nass.usda.gov/datasets/qs.census2022.txt.gz" | zcat | awk -F'\t' 'NR==1 || (($0 ~ /NORTH CAROLINA|SOUTH CAROLINA/) && ($0 ~ /AG LAND, INCL BUILDINGS - ASSET VALUE, MEASURED IN \$ \/ ACRE|AG LAND, CROPLAND - ACRES|AG LAND, PASTURELAND - ACRES|AG LAND, WOODLAND - ACRES|AG LAND - ACRES|FARM OPERATIONS - NUMBER OF OPERATIONS/) && ($0 ~ /\tCOUNTY\t|\tSTATE\t/))' > can-i-live-here/data/raw/nass_census2022_ncsc.tsv; wc -l can-i-live-here/data/raw/nass_census2022_ncsc.tsv; head -2 can-i-live-here/data/raw/nass_census2022_ncsc.tsv | cut -c1-400
      - name: NC and SC property tax rate files, DOL childcare, EPI budgets
        continue-on-error: true
        run: |
          curl -sSL -A "$UA" "https://www.ncdor.gov/taxes-forms/property-tax/property-tax-rates" -o raw/ncdor.html; grep -oE 'href="[^"]*"' raw/ncdor.html | grep -iE 'rate|xls' | sort -u > can-i-live-here/data/raw/ncdor_links.txt; head -30 can-i-live-here/data/raw/ncdor_links.txt
          for L in $(grep -oE 'href="[^"]*(xlsx|xls)[^"]*"' raw/ncdor.html | sed 's/href="//;s/"$//' | sort -u | head -12); do
            case "$L" in http*) U="$L";; *) U="https://www.ncdor.gov$L";; esac
            N=$(basename "$U" | tr -c 'A-Za-z0-9._-\n' '_'); curl -sSL -A "$UA" "$U" -o "can-i-live-here/data/raw/ncdor_$N" && echo "got $U"
          done
          curl -sSL -A "$UA" "https://www.ncdor.gov/taxes-forms/property-tax/property-tax-rates/county-property-tax-rates-and-reappraisal-schedules" -o raw/ncdor2.html; grep -oE 'href="[^"]*"' raw/ncdor2.html | grep -iE 'fiscal-year|rate' | sort -u >> can-i-live-here/data/raw/ncdor_links.txt || true
          for P in fiscal-year-2026-2027 fiscal-year-2025-2026 taxes-forms/property-tax/property-tax-rates/county-and-municipal-effective-tax-rates local-government/information-unit/reports-statistics-property-tax-rates/county-and-municipal-property-tax-rates-and-year-most-recent-reappraisal; do
            curl -sSL -A "$UA" "https://www.ncdor.gov/$P" -o raw/ncp.html
            for L in $(grep -oE 'href="[^"]*(xlsx|xls|pdf)[^"]*"' raw/ncp.html | sed 's/href="//;s/"$//' | sort -u | head -10); do
              case "$L" in http*) U="$L";; *) U="https://www.ncdor.gov$L";; esac
              N=$(basename "$U" | tr -c 'A-Za-z0-9._-\n' '_'); curl -sSL -A "$UA" "$U" -o "can-i-live-here/data/raw/ncdor_$(basename $P)_$N" && echo "got $U"
            done
          done
          curl -sSfL -A "$UA" "https://www.dol.gov/sites/dolgov/files/WB/NDCP2022.xlsx" -o can-i-live-here/data/raw/dol_ndcp2022.xlsx && echo "got NDCP2022" || echo "NDCP fail"
          curl -sSL -A "$UA" "https://www.dol.gov/agencies/wb/topics/featured-childcare" -o raw/dol.html; grep -oE 'href="[^"]*\.(xlsx|csv|zip)"' raw/dol.html | sort -u > can-i-live-here/data/raw/dol_childcare_links.txt || true; head can-i-live-here/data/raw/dol_childcare_links.txt
          curl -sSL -A "$UA" "https://www.epi.org/resources/budget/" -o raw/epi.html; grep -oE 'href="[^"]*(xlsx|csv|zip|download)[^"]*"' raw/epi.html | sort -u > can-i-live-here/data/raw/epi_links.txt || true; head can-i-live-here/data/raw/epi_links.txt
          curl -sSL -A "$UA" "https://www.sccounties.org/property-tax-rates" -o raw/scac.html; grep -oiE '[^"'"'"' ]*\.(pdf|xlsx)' raw/scac.html | sort -u > can-i-live-here/data/raw/scac_links.txt || true; head can-i-live-here/data/raw/scac_links.txt
          for L in $(grep -iE 'rate|millage' can-i-live-here/data/raw/scac_links.txt | head -4); do case "$L" in http*) U="$L";; *) U="https://www.sccounties.org$L";; esac; curl -sSfL -A "$UA" "$U" -o "can-i-live-here/data/raw/scac_$(basename $U)" && echo "got $U" || true; done
          curl -sSL -A "$UA" "https://entp.hud.gov/idapp/html/hicostlook.cfm" -o can-i-live-here/data/raw/hud_fha_limits_form.html || true; grep -oiE '<(form|select|input)[^>]*>' can-i-live-here/data/raw/hud_fha_limits_form.html | head -20
      - name: USDA Rural Development ineligible areas (ArcGIS REST, NC and SC extent)
        continue-on-error: true
        run: |
          B="https://rdgdwe.sc.egov.usda.gov/arcgis/rest/services/Eligibility/Eligibility/MapServer"
          curl -sSL -A "$UA" "$B?f=json" -o raw/usda_svc.json; python3 -c "import json;d=json.load(open('raw/usda_svc.json'));print([(l['id'],l['name']) for l in d.get('layers',[])])"
          for L in 4 3 2 1 0; do
            curl -sSL -A "$UA" "$B/$L?f=json" -o raw/usda_l$L.json; python3 -c "import json,sys;d=json.load(open('raw/usda_l$L.json'));print($L,d.get('name'),d.get('geometryType'))"
          done
          mkdir -p raw/usda
          for L in 4 3 2 1 0; do
            NAME=$(python3 -c "import json;print(json.load(open('raw/usda_l$L.json')).get('name',''))")
            case "$NAME" in *neligible*) ;; *) continue;; esac
            OFF=0; PART=0
            while :; do
              curl -sSL -A "$UA" "$B/$L/query" --data-urlencode "where=1=1" --data-urlencode "geometry=-84.4,32.0,-75.4,36.7" --data-urlencode "geometryType=esriGeometryEnvelope" --data-urlencode "inSR=4326" --data-urlencode "spatialRel=esriSpatialRelIntersects" --data-urlencode "outFields=OBJECTID" --data-urlencode "outSR=4326" --data-urlencode "resultOffset=$OFF" --data-urlencode "resultRecordCount=500" --data-urlencode "f=geojson" -o raw/usda/part_$PART.geojson
              N=$(python3 -c "import json;d=json.load(open('raw/usda/part_$PART.geojson'));print(len(d.get('features',[])))" 2>/dev/null || echo 0)
              echo "layer $L offset $OFF features $N"; [ "$N" -lt 500 ] && break; OFF=$((OFF+500)); PART=$((PART+1)); [ $PART -gt 60 ] && break
            done
            npx -y mapshaper@0.6 raw/usda/part_*.geojson combine-files -merge-layers -simplify 20% keep-shapes -o precision=0.0001 format=geojson can-i-live-here/data/raw/usda_ineligible.geojson || true
            ls -la can-i-live-here/data/raw/usda_ineligible.geojson; break
          done
      - name: Grocery stores and supermarkets from Overture Maps (DuckDB over S3)
        continue-on-error: true
        run: |
          pip3 install -q duckdb
          REL=$(curl -sS "https://overturemaps-us-west-2.s3.amazonaws.com/?prefix=release/&delimiter=/" | grep -oE "release/[0-9.-]+/" | sort | tail -1)
          echo "release $REL"
          python3 - "$REL" <<'PY'
          import duckdb,sys,json
          rel=sys.argv[1]
          con=duckdb.connect(); con.execute("INSTALL httpfs; LOAD httpfs; SET s3_region='us-west-2';")
          q=f"""SELECT id, names.primary AS name, categories.primary AS cat, geometry.x() AS lon, geometry.y() AS lat
                FROM read_parquet('s3://overturemaps-us-west-2/{rel}theme=places/type=place/*', filename=true, hive_partitioning=1)
                WHERE bbox.xmin BETWEEN -84.5 AND -75.3 AND bbox.ymin BETWEEN 31.9 AND 36.7
                  AND categories.primary IN ('grocery_store','supermarket','warehouse_store','wholesale_grocer')"""
          try:
              con.execute("INSTALL spatial; LOAD spatial;")
              rows=con.execute(q.replace('geometry.x()','ST_X(ST_GeomFromWKB(geometry))').replace('geometry.y()','ST_Y(ST_GeomFromWKB(geometry))')).fetchall()
          except Exception as e:
              print('spatial failed',e); rows=[]
          out=[{'id':r[0],'name':r[1],'cat':r[2],'lon':round(r[3],5),'lat':round(r[4],5)} for r in rows]
          json.dump({'release':rel,'count':len(out),'stores':out},open('can-i-live-here/data/raw/overture_grocery.json','w'))
          print('stores',len(out))
          PY
      - name: Record run metadata and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > can-i-live-here/data/raw/fetched_at.txt
          ls -la can-i-live-here/data/raw
          du -sh can-i-live-here/data/raw
          git config user.name "cilh-data-bot"; git config user.email "cilh-data-bot@users.noreply.github.com"
          git add can-i-live-here/data/raw
          git commit -m "Data: raw source files trimmed to NC and SC (fetched by GitHub Actions)" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
