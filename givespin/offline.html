<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | GiveSpin</title>
  <meta name="theme-color" content="#0a1219">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    /* This page is shown by sw.js when the network is cut and the app itself is not saved on this device yet. It stands alone: no other file is needed. */
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #0a1219; color: #ecf5f9; font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: grid; place-items: center; padding: 24px 16px; min-height: 100vh; box-sizing: border-box; background: radial-gradient(900px 420px at 72% -80px, rgba(34, 240, 122, 0.08), transparent 70%), #0a1219; }
    main { max-width: 30rem; text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 18px; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; line-height: 1.2; }
    p { margin: 0 0 14px; color: #9bb3c0; }
    .house { color: #ffc542; font-weight: 600; }
    a.btn { display: inline-block; margin-top: 6px; padding: 11px 20px; border-radius: 12px; background: #22f07a; color: #03210f; font-weight: 800; text-decoration: none; }
    a.btn:hover { background: #52ffa0; }
    a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22f07a"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs>
      <rect x="1.5" y="1.5" width="37" height="37" rx="11" fill="url(#lg)"/>
      <circle cx="20" cy="20" r="12.5" fill="none" stroke="#03210f" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3.2 3.2"/>
      <path d="M20 28.2c-.4 0-.7-.1-1-.4-4.1-3.6-7-6.2-7-9.6 0-2.3 1.8-4.1 4-4.1 1.6 0 3.1.8 4 2.2.9-1.4 2.4-2.2 4-2.2 2.2 0 4 1.8 4 4.1 0 3.4-2.9 6-7 9.6-.3.3-.6.4-1 .4Z" fill="#03210f"/>
    </svg>
    <h1>You are offline.</h1>
    <p class="house">The house is still a charity.</p>
    <p>GiveSpin could not reach the network, and this device has not saved the app yet. Nothing was lost and nothing was charged. Connect, then try again.</p>
    <a class="btn" href="./">Try again</a>
  </main>
</body>
</html>
